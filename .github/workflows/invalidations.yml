name: Invalidations

on:
  pull_request:
    # Limit invalidations gating to runtime surfaces that can change Agentif import behavior.
    # Monorepo/docs/CI-only changes should not be blocked by this check.
    paths:
    - Agentif/src/**
    - Agentif/ext/**
    - Agentif/Project.toml
    - LLMProviders/src/**
    - LLMProviders/ext/**
    - LLMProviders/Project.toml

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: always.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    # Only run on PRs to the default branch.
    # In the PR trigger above branches can be specified only explicitly whereas this check should work for master, main, or any other default branch
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: julia-actions/setup-julia@v2
      with:
        version: '1'
    - uses: julia-actions/cache@v2

    - name: Measure invalidations on PR branch
      id: invs_pr
      run: |
        julia -e '
          using Pkg
          # Use the repo-root environment rather than a fresh temp one: several
          # runtime deps (JSONSchema, HTTP, ConcurrentUtilities, ...) are only
          # available through the root Project.toml [sources] git URLs, and a temp
          # env cannot resolve them from the registry.
          Pkg.activate(".")
          Pkg.add([
              Pkg.PackageSpec(name = "SnoopCompile", version = "3", uuid = "aa65fe97-06da-5843-b5b1-d5d13cad87d2"),
              Pkg.PackageSpec(name = "SnoopCompileCore", uuid = "e2b509da-e806-4183-be48-004708413034"),
          ])
          using SnoopCompileCore: @snoop_invalidations
          using SnoopCompile: filtermod, invalidation_trees, uinvalidated
          invalidations = @snoop_invalidations begin
              import Agentif
          end
          for t in invalidation_trees(invalidations)
              m = try; t.method; catch; nothing; end
              m === nothing && (println("TRIGGER|<nomethod>|", typeof(t)); continue)
              println("TRIGGER|", m.module, "|", m.name, "|", basename(String(m.file)), ":", m.line)
          end
          inv_owned = length(filtermod(Agentif, invalidation_trees(invalidations)))
          inv_total = length(uinvalidated(invalidations))
          inv_deps = inv_total - inv_owned
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "total=$(inv_total)")
              println(io, "deps=$(inv_deps)")
          end
        '

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    - name: Measure invalidations on default branch
      id: invs_default
      run: |
        julia -e '
          using Pkg
          # Use the repo-root environment rather than a fresh temp one: several
          # runtime deps (JSONSchema, HTTP, ConcurrentUtilities, ...) are only
          # available through the root Project.toml [sources] git URLs, and a temp
          # env cannot resolve them from the registry.
          Pkg.activate(".")
          Pkg.add([
              Pkg.PackageSpec(name = "SnoopCompile", version = "3", uuid = "aa65fe97-06da-5843-b5b1-d5d13cad87d2"),
              Pkg.PackageSpec(name = "SnoopCompileCore", uuid = "e2b509da-e806-4183-be48-004708413034"),
          ])
          using SnoopCompileCore: @snoop_invalidations
          using SnoopCompile: filtermod, invalidation_trees, uinvalidated
          invalidations = @snoop_invalidations begin
              import Agentif
          end
          for t in invalidation_trees(invalidations)
              m = try; t.method; catch; nothing; end
              m === nothing && (println("TRIGGER|<nomethod>|", typeof(t)); continue)
              println("TRIGGER|", m.module, "|", m.name, "|", basename(String(m.file)), ":", m.line)
          end
          inv_owned = length(filtermod(Agentif, invalidation_trees(invalidations)))
          inv_total = length(uinvalidated(invalidations))
          inv_deps = inv_total - inv_owned
          open(ENV["GITHUB_OUTPUT"], "a") do io
              println(io, "total=$(inv_total)")
              println(io, "deps=$(inv_deps)")
          end
        '
    
    - name: Report invalidation counts
      run: |
        echo "Invalidations on default branch: ${{ steps.invs_default.outputs.total }} (${{ steps.invs_default.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
        echo "This branch: ${{ steps.invs_pr.outputs.total }} (${{ steps.invs_pr.outputs.deps }} via deps)" >> $GITHUB_STEP_SUMMARY
    - name: Check if the PR does increase number of invalidations
      if: steps.invs_pr.outputs.total > steps.invs_default.outputs.total
      run: exit 1
